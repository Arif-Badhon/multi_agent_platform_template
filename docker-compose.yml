version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice_ai_api
    ports:
      - "8000:8000"
    env_file:
      - .env  
    environment:
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - QDRANT_LOCATION=http://qdrant:6333
      - QDRANT_COLLECTION=voice_ai_docs
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=llama3.2
      - LLM_TEMPERATURE=0.0
      - REDIS_URL=redis://redis:6379/0
      - API_KEY_SECRET=${API_KEY_SECRET}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - CARTESIA_API_KEY=${CARTESIA_API_KEY}
    depends_on:
      - qdrant
      - ollama
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: voice_ai_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: voice_ai_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Depending on the host machine, you may want to enable GPU support here.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
  
  redis:
    image: redis:7-alpine
    container_name: voice_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  qdrant_data:
  ollama_data:
  redis_data:

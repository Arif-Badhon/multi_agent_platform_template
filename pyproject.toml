[project]
name = "voice-ai-agent"
version = "0.1.0"
description = "Real-time, offline, multi-agent voice AI architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "langgraph>=0.1.0",
    "langchain-community>=0.2.0",
    "ollama>=0.2.1",
    "qdrant-client>=1.9.0",
    "pipecat-ai>=0.1.0",
    "faster-whisper>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.2",
    "tenacity>=8.2.0",
    "prometheus-client>=0.20.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/agents"]
